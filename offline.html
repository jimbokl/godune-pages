<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Прогулки с собой — Балтийские дюны</title><style>body{margin:0;background:#f7f5ee;color:#263538;font:17px/1.65 system-ui,sans-serif}main{max-width:640px;padding:12vh 24px;margin:auto}h1{font:normal 48px/1.1 Georgia,serif}a{color:inherit}li{margin:20px 0}.eyebrow{font-size:11px;letter-spacing:.2em}button{padding:13px 20px;background:#bfd9e7;color:#243f52;border:0;font:inherit}</style></head><body><main><p class="eyebrow">БАЛТИЙСКИЕ ДЮНЫ</p><h1>Эта страница осталась на берегу</h1><p>Сети сейчас нет, а эту страницу Вы ещё не загружали. Откройте карту или прогулку, которую взяли с собой.</p><ul id="walks"></ul><p id="notice" role="status">Ищем загруженные прогулки…</p><p><a href="/planner/">Моя поездка →</a></p><button type="button" onclick="location.reload()">Попробовать ещё раз</button></main><script>
(async()=>{const list=document.getElementById('walks'),notice=document.getElementById('notice');try{const worker=navigator.serviceWorker.controller || (await navigator.serviceWorker.ready).active,packages=await new Promise((resolve,reject)=>{const channel=new MessageChannel();channel.port1.onmessage=({data})=>{channel.port1.close();if(data.type==='done')resolve(data.value);else reject(new Error(data.message));};worker.postMessage({type:'LIST'},[channel.port2]);});for(const data of packages){const li=document.createElement('li'),a=document.createElement('a');a.href=data.kind==='region'?'/map/':'/routes/'+data.slug+'/';a.textContent=data.name;li.append(a);list.append(li);}notice.textContent=list.children.length?'Эти карты и прогулки доступны без сети.':'Пока нет скачанных карт. Подключитесь к сети и выберите территорию или прогулку в разделе «С собой».';}catch{notice.textContent='Браузер не дал открыть хранилище. Попробуйте вернуться к уже открытой прогулке.';}})();
</script></body></html>
