<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Прогулки с собой — Маршруты Балтики</title><style>body{margin:0;background:#f7f5ee;color:#263538;font:17px/1.65 system-ui,sans-serif}main{max-width:640px;padding:12vh 24px;margin:auto}h1{font:normal 48px/1.1 Georgia,serif}a{color:inherit}li{margin:20px 0}.eyebrow{font-size:11px;letter-spacing:.2em}button{padding:13px 20px;background:#bfd9e7;color:#243f52;border:0;font:inherit}</style></head><body><main><p class="eyebrow">МАРШРУТЫ БАЛТИКИ</p><h1>Эта страница осталась на берегу</h1><p>Сети сейчас нет, а эту страницу Вы ещё не загружали. Откройте карту или прогулку, которую взяли с собой.</p><ul id="walks"></ul><p id="notice" role="status">Ищем загруженные прогулки…</p><p><a href="/planner/">Моя поездка →</a></p><button type="button" onclick="location.reload()">Попробовать ещё раз</button></main><script>
(async()=>{const list=document.getElementById('walks'),notice=document.getElementById('notice');try{for(const name of await caches.keys()){if(!name.startsWith('godune-walk-offline:v1:'))continue;const cache=await caches.open(name),response=await cache.match(new URL('/__godune_package__',location.origin));if(!response)continue;const data=await response.json(),stored=new Set((await cache.keys()).map(r=>r.url));if(!data.resources.every(r=>stored.has(new URL(r.path,location.origin).href)))continue;const li=document.createElement('li'),a=document.createElement('a');a.href=data.kind==='region'?'/map/':'/routes/'+data.slug+'/';a.textContent=data.name;li.append(a);list.append(li);}notice.textContent=list.children.length?'Эти карты и прогулки доступны без сети.':'Пока нет скачанных карт. Подключитесь к сети и выберите территорию или прогулку в разделе «С собой».';}catch{notice.textContent='Браузер не дал открыть хранилище. Попробуйте вернуться к уже открытой прогулке.';}})();
</script></body></html>
